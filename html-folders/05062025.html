<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nth of type</title>
    <style>
        p:nth-child(even){
            color: blue;
        }
        p:nth-of-type(odd){
            color: green;
            background-color: aqua;
        }
    </style>
</head>
<body>
    <div>
        
        <h1>Headings 1</h1>
        <h1>Headings 2</h1>
        <h1>Headings 3</h1>
        <h1>Headings 4</h1>
        <h1>Headings 5</h1>
        <p>Paragraphs 1</p>
        <p>Paragraphs 2</p>
        <p>Paragraphs 3</p>
        <p>Paragraphs 4</p>
        <p>Paragraphs 5</p>
    </div>
</body>
</html>
