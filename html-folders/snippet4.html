<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        a{
            color: aqua;
            font-size: xx-large;
        }
        input[type="text"] {
            border: 5px dashed blue;
            border-radius: 10px;
            padding: 10px;
        }
        a[href^="https://"]{
            color: blue;
            font-size: xx-large;
        }
        a[href^="/"]{
            color: brown;
        }
    </style>
</head>
<body>
    <a href="https://www.example.com">Example Link</a>
    <a href="/about">About Us</a>
    <input type="text" name="username" placeholder="enter a text">
    <input type="submit" value="Search">
</body>
</html>
